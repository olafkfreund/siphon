{{define "audit"}}<div class="top"><div><h1>Audit</h1><div class="muted">Who did what, newest first.</div></div></div>
<section class="card"><table class="cards"><thead><tr><th>Time</th><th>Event</th><th class="hide-sm">Actor</th><th>Job</th><th>Detail</th></tr></thead><tbody>
{{range .Audit}}<tr><td class="muted small" title="{{tm .At}}" data-label="Time">{{ago .At}}</td><td data-label="Event"><span class="pill tag">{{.Event}}</span></td><td class="hide-sm" data-label="Actor">{{.Actor}}</td><td data-label="Job">{{if .JobID}}<a href="/jobs/{{.JobID}}">{{.JobID}}</a>{{end}}</td><td class="small wrap" data-label="Detail">{{.Detail}}</td></tr>
{{else}}<tr><td colspan="5"><div class="empty">No audit entries yet.</div></td></tr>{{end}}
</tbody></table></section>{{end}}
