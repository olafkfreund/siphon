{{define "audit"}}<div class="top"><div><h1>Audit</h1><div class="muted">Who did what, newest first.</div></div></div>
{{if .Audit}}<div class="filter-bar" data-filter-scope="audit" hidden>
  <input type="search" class="filter-search" aria-label="Filter the audit log" placeholder="Filter by actor, event, job, detail…  /" autocomplete="off">
</div>
<p class="filter-none muted" data-filter-scope="audit" hidden>No entries match. <button type="button" class="btn sm" data-action="clear-filter">Clear filter</button></p>
{{end}}<div data-filter-list="audit">
{{range .Audit}}<div class="card item-card row" data-filter-item data-text="{{.Actor}} {{.Event}} {{.JobID}} {{.Detail}}">
  <span class="muted small" title="{{tm .At}}">{{ago .At}}</span><span class="pill tag">{{.Event}}</span><b class="c-actor">{{.Actor}}</b>{{if .JobID}}<a href="/jobs/{{.JobID}}">#{{.JobID}}</a>{{end}}<span class="small wrap">{{.Detail}}</span>
</div>
{{else}}<section class="card"><div class="empty">No audit entries yet.</div></section>{{end}}
</div>{{end}}
