{{define "audit"}}<h1>Audit</h1>
<table><tr><th>Time</th><th>Actor</th><th>Event</th><th>Job</th><th>Detail</th></tr>
{{range .Audit}}<tr><td>{{tm .At}}</td><td>{{.Actor}}</td><td>{{.Event}}</td><td>{{if .JobID}}<a href="/jobs/{{.JobID}}">{{.JobID}}</a>{{end}}</td><td>{{.Detail}}</td></tr>
{{else}}<tr><td colspan="5">none</td></tr>{{end}}</table>{{end}}
