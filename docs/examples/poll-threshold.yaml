# example: poll-threshold - react when a polled JSON value crosses a threshold.
# apply:   siphon apply -f poll-threshold.yaml
sources:
  disk:
    type: http
    url: https://metrics.example.com/api/disk
    poll: 5m
rules:
  - name: disk-full
    source: disk
    when: 'event.used_pct > 90'
    on: edge                        # fires on false -> true only
    repeat: 6h                      # and again every 6 h while it stays true
    action: { cmd: [echo, "disk at {{.event.used_pct}}%"] }
