# title:    Summarise Datadog monitor alerts with a local model, then notify
# category: Ops & monitoring
# needs:    sources/datadog                        (siphon connect datadog)
#           credentials/ollama-local               (siphon connect model ollama)
# apply:    siphon apply -f datadog-monitor-alert.yaml
# Datadog → Integrations → Webhooks: set the Payload field to
#   {"id":"$ID","title":"$EVENT_TITLE","transition":"$ALERT_TRANSITION","monitor":"$ALERT_ID","link":"$LINK","body":"$EVENT_MSG"}
# and mention @webhook-<name> in the monitor's notification message.
agents:
  datadog-summary:
    kind: model
    credential: ollama-local
    model: llama3.2
    prompt: |
      Datadog monitor "{{.event.title}}" (monitor {{.event.monitor}}) changed to {{.event.transition}}.
      Details: {{.event.body}}
      Link: {{.event.link}}
      Summarise for an on-call engineer in at most three lines: what is wrong, where, how bad.
    max_turns: 2
    timeout: 5m
    approve: false                  # a read-only summary; nothing acts on it
routines:
  datadog-to-phone:
    steps:
      - { id: summary, agent: datadog-summary, timeout: 5m }
      - { id: notify, if: 'steps.summary.exit == 0', cmd: [curl, -fsS, -H, "Title: Alert", --data-raw, "{{.steps.summary.json.result}}", https://ntfy.sh/siphon-CHANGE-ME] }
rules:
  - name: monitor-triggered
    source: datadog
    when: 'event.transition in ["Triggered", "Re-Triggered"]'
    on: each
    id: event.id
    cooldown: 2m
    action: { routine: datadog-to-phone }
