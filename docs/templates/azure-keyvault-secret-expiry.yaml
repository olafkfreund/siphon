# title:    Push a notification when an Azure Key Vault secret is near expiry
# category: Ops & monitoring
# needs:    sources/azure-eventgrid-hooks         (siphon connect azure-eventgrid)
# apply:    siphon apply -f azure-keyvault-secret-expiry.yaml
rules:
  - name: keyvault-secret-near-expiry
    source: azure-eventgrid-hooks
    when: '(event.eventType ?? event.type) == "Microsoft.KeyVault.SecretNearExpiry"'
    on: each
    id: event.id
    action:
      cmd: [curl, -fsS, -H, "Title: Key Vault secret near expiry", --data-raw, "Azure Key Vault: {{.event.subject}} is near expiry", https://ntfy.sh/siphon-CHANGE-ME]
